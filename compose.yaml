# The development databases, a MariaDB and a PostgreSQL: `docker compose up -d --wait`.
# Both hold the same dataset (dev/fixtures/), loaded the first time a volume is created and never touched after.
name: tiana-tables-dev

services:
  # Writes each server's init scripts, read on its first start: neither image has node to run the generator.
  fixtures:
    image: node:22-alpine
    volumes:
      - ./dev/fixtures:/fixtures:ro,z
      - mysql-init:/out/mysql
      - postgres-init:/out/postgres
    command:
      - sh
      - -ec
      - |
        for dialect in mysql postgres; do
          cp /fixtures/$$dialect/schema.sql /out/$$dialect/1-schema.sql
          node /fixtures/generate.mjs $$dialect > /out/$$dialect/2-rows.sql.tmp
          mv /out/$$dialect/2-rows.sql.tmp /out/$$dialect/2-rows.sql
        done
        cp /fixtures/postgres/verification.sql /out/postgres/3-verification.sql

  mysql:
    image: mariadb:11
    container_name: tiana-dev-mysql
    restart: unless-stopped
    ports:
      - 13306:3306
    environment:
      MARIADB_ROOT_PASSWORD: devpassword
      MARIADB_DATABASE: tiana_dev
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-init:/docker-entrypoint-initdb.d:ro
    depends_on:
      fixtures:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      retries: 60

  postgres:
    image: postgres:18
    container_name: tiana-dev-postgres
    restart: unless-stopped
    ports:
      - 15432:5432
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: tiana_dev
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-init:/docker-entrypoint-initdb.d:ro
    depends_on:
      fixtures:
        condition: service_completed_successfully
    healthcheck:
      # over TCP: the server that runs the init scripts only listens on its socket
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, tiana_dev]
      interval: 2s
      retries: 60

volumes:
  mysql-data:
    name: tiana-dev-mysql
  postgres-data:
    name: tiana-dev-postgres
  mysql-init:
  postgres-init:
